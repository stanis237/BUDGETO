name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Adjust Gradle memory for CI
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx8G/org.gradle.jvmargs=-Xmx2G/g' android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        # We use --no-pub because we already did it.
        # --debug-signing is implicitly handled by your build.gradle.kts
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stankap-release
          path: build/app/outputs/flutter-apk/app-release.apk
        if: success()
